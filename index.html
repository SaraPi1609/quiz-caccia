": 2}, {"n": 14, "s": "Legislazione Venatoria Nazionale e Regionale", "q": "Quali documenti deve portare con sé il cacciatore durante la giornata di caccia?", "o": ["Soltanto lalicenza", "Soltanto il tesserino di caccia controllata", "La licenza, il tesserino, l'assicurazione ed i versamenti delle tasse governativa e regionale"], "c": 2}, {"n": 15, "s": "Legislazione Venatoria Nazionale e Regionale", "q": "Come viene normalmente a conoscenza il cacciatore dei limiti stabiliti per l'esercizio venatorio?", "o": ["Attraverso laradio e la televisione", "Attraverso appositi volantini", "Attraverso la pubblicazione del calendario venatorio"], "c": 2}, {"n": 16, "s": "Legislazione Venatoria Nazionale e Regionale", "q": "INei 12 mesi successivi al rilascio della prima licenza il cacciatore può:", "o": ["esercitare la caccia solo da appostamento fisso o temporaneo", "esercitare la caccia solo alla selvaggina stanziale", "esercitare la caccia solo se accompagnato da un altro cacciatore in possesso di licenza da almeno 3 anni"], "c": 2}, {"n": 17, "s": "Legislazione Venatoria Nazionale e Regionale", "q": "Che cosa si intende per caccia programmata?", "o": ["L'esercizio venatorio soggetto a pianificazione faunistico- venatoria, legame cacciatore- territorio e forma esclusiva di caccia", "L'esercizio venatorio soggetto a limitazioni di tempo", "L'esercizio venatorio soggetto a limitazioni di tempo, di luogo e di capi da abbattere"], "c": 0}, {"n": 18, "s": "Legislazione Venatoria Nazionale e Regionale", "q": "Chi distribuisce il tesserino reg ionde l'esercizio della caccia?", "o": ["per L'Associazione venatoria di appartenenza", "Il Comune di residenza", "Le Provincia"], "c": 1}, {"n": 19, "s": "Legislazione Venatoria Nazionale e Regionale", "q": "Quale è l'eta minima, richiesta dalla legge, per esercitare la caccia?", "o": ["16 anni", "18 anni", "21 anni"], "c": 1}, {"n": 20, "s": "Legislazione Venatoria Nazionale e Regionale", "q": "Quale è la durata della licenza di caccia?", const PER=4,MAXERR=3,app=document.getElementById('app');
const SECS=[...new Set(DB.map(x=>x.s))];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let Q=[],i=0,ans=[],done=false;
function start(){
  Q=[];SECS.forEach(s=>Q.push(...sh(DB.filter(x=>x.s===s)).slice(0,PER)));
  i=0;ans=[];done=false;render();
}
const errs=()=>ans.filter((a,k)=>a!==Q[k].c).length;
function home(){
  app.innerHTML=`<h1>Simulatore d’esame venatorio</h1>
  <p class="mut">Banca dati: ${DB.length} domande in ${SECS.length} sezioni.</p>
  <div class="card"><h2>Come funziona</h2>
  <p>${PER*SECS.length} domande a risposta singola, ${PER} per ciascuna sezione, estratte a caso a ogni tentativo.<br>
  Superi la prova con al massimo <b>${MAXERR} errori</b>. Dopo ogni risposta vedi subito se è corretta.</p>
  <table>${SECS.map(s=>`<tr><td>${s}</td><td style="text-align:right">${PER} domande</td></tr>`).join('')}</table>
  <div class="row"><button class="p" onclick="start()">Inizia il quiz</button></div></div>`;
}
function render(){
  if(done)return result();
  const q=Q[i],a=ans[i],e=errs(),ansd=a!==undefined;
  app.innerHTML=`<div class="top"><span>Domanda ${i+1} di ${Q.length}</span>
  <span class="err ${e>MAXERR?'d':''}">Errori: ${e} / ${MAXERR}</span></div>
  <div class="bar"><i style="width:${i/Q.length*100}%"></i></div>
  <div class="card"><div class="sec">${q.s}</div><p class="q">${q.q}</p>
  ${q.o.map((t,k)=>{let c='';if(ansd){if(k===q.c)c='ok';else if(k===a)c='ko'}
   return `<button class="o ${c}" ${ansd?'disabled style="opacity:1"':''} onclick="pick(${k})"><b>${'ABC'[k]}</b><span>${t}</span></button>`}).join('')}
  ${ansd?`<p class="mut">${a===q.c?'✓ Risposta corretta.':'✗ Risposta errata. Quella giusta è la '+'ABC'[q.c]+'.'}</p>`:''}
  </div>
  <div class="row"><button class="p" ${ansd?'':'disabled'} onclick="next()">${i===Q.length-1?'Vedi risultato':'Avanti'}</button></div>`;
  window.scrollTo(0,0);
}
function pick(k){ans[i]=k;render()}
function next(){if(i===Q.length-1)done=true;else i++;render()}
function result(){
  const e=errs(),ok=e<=MAXERR;
  const per=SECS.map(s=>{const idx=Q.map((q,k)=>q.s===s?k:-1).filter(k=>k>=0);return [s,idx.filter(k=>ans[k]!==Q[k].c).length,idx.length]});
  const wrong=Q.map((q,k)=>[q,k]).filter(([q,k])=>ans[k]!==q.c);
  app.innerHTML=`<div class="card res"><div class="big ${ok?'pass':'fail'}">${ok?'PROMOSSO':'NON SUPERATO'}</div>
  <p>${e} errori su ${Q.length} domande (massimo consentito: ${MAXERR})<br><span class="mut">Risposte corrette: ${Q.length-e}</span></p>
  <div class="row" style="justify-content:center"><button class="p" onclick="start()">Nuovo quiz</button><button onclick="home()">Home</button></div></div>
  <div class="card"><h2>Errori per sezione</h2><table>${per.map(([s,x,n])=>`<tr><td>${s}</td><td style="text-align:right">${x} / ${n}</td></tr>`).join('')}</table></div>
  ${wrong.length?`<h2>Da ripassare</h2>`+wrong.map(([q,k])=>`<div class="rv"><div class="sec">${q.s}</div><p class="q" style="font-size:1rem"><b>${q.q}</b></p>
  <p class="mut">La tua risposta: <span style="color:var(--ko)">${'ABC'[ans[k]]}. ${q.o[ans[k]]}</span><br>Risposta corretta: <span style="color:var(--ok)">${'ABC'[q.c]}. ${q.o[q.c]}</span></p></div>`).join(''):'<p class="mut">Nessun errore: ottimo lavoro!</p>'}`;
  window.scrollTo(0,0);
}
home();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
